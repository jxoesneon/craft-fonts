name: Multi-Platform Release Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  # craft-fonts ships font assets, not a compiled app: the release package is a versioned
  # archive of the OFL font tree (plus licences), and the workspace build acts as the
  # integrity gate.
  package-fonts:
    name: Font bundle (tar.gz / zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --release --workspace --locked
      - name: Package font archives
        run: |
          mkdir -p dist
          version=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)
          tar -czf "dist/craft-fonts-${version}.tar.gz" fonts OFL.txt LICENSE-APACHE LICENSE-MIT ATTRIBUTION.md 2>/dev/null \
            || tar -czf "dist/craft-fonts-${version}.tar.gz" fonts LICENSE-APACHE LICENSE-MIT ATTRIBUTION.md
          cd fonts && zip -qr "../dist/craft-fonts-${version}.zip" . && cd ..
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: craft-fonts-bundle
          path: dist/*
